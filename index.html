<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Tra Độ Uy Tín</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: 0.4s;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            font-weight: 300;
            margin-bottom: 35px;
        }

        /* Nút check */
        .check-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
            letter-spacing: 1.5px;
            margin-bottom: 35px;
        }

        .check-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 40px rgba(245, 87, 108, 0.6);
        }

        .check-btn:active {
            transform: scale(0.96);
        }

        /* Kết quả */
        .result-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 25px 20px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }

        .score-display {
            font-size: 72px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            transition: 0.2s;
            margin-bottom: 8px;
        }

        .score-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .status {
            margin-top: 18px;
            font-size: 24px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            display: inline-block;
            transition: 0.3s;
        }

        .status.high {
            color: #a3ffb5;
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid rgba(0, 255, 100, 0.25);
        }

        .status.medium {
            color: #ffdb8a;
            background: rgba(255, 200, 0, 0.15);
            border: 1px solid rgba(255, 200, 0, 0.25);
        }

        .status.low {
            color: #ff8a8a;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.25);
        }

        /* Thanh độ uy tín */
        .trust-bar-wrap {
            margin: 20px 0 5px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .trust-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #f5576c, #f093fb, #4facfe);
            transition: width 0.6s ease;
        }

        /* footer */
        .footer-note {
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* mobile */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .score-display {
                font-size: 56px;
            }
            .check-btn {
                font-size: 18px;
                padding: 15px 35px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ Kiểm Tra Uy Tín</h1>
        <p class="subtitle">Bấm nút bên dưới để kiểm tra độ uy tín của bạn</p>

        <button class="check-btn" id="checkBtn">✨ CHECK</button>

        <div class="result-box" id="resultBox">
            <div class="score-label">ĐIỂM UY TÍN</div>
            <div class="score-display" id="scoreDisplay">--</div>

            <div class="trust-bar-wrap">
                <div class="trust-bar" id="trustBar" style="width:0%;"></div>
            </div>

            <div id="statusBadge" class="status">Chưa kiểm tra</div>
        </div>

        <div class="footer-note">✅ Điểm luôn ≥ 50 · Uy tín là vàng</div>
    </div>

    <script>
        (function() {
            const checkBtn = document.getElementById('checkBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const trustBar = document.getElementById('trustBar');
            const statusBadge = document.getElementById('statusBadge');

            // Hàm random trong khoảng [50, 100]
            function randomTrustScore() {
                return Math.floor(Math.random() * 51) + 50; // 50 → 100
            }

            // Cập nhật giao diện dựa trên điểm
            function updateUI(score) {
                // Hiển thị số
                scoreDisplay.textContent = score;

                // Thanh tiến trình (tối đa 100)
                trustBar.style.width = score + '%';

                // Badge trạng thái + màu
                let statusText = '';
                let statusClass = '';

                if (score >= 80) {
                    statusText = '🌟 Rất uy tín';
                    statusClass = 'high';
                } else if (score >= 65) {
                    statusText = '👍 Uy tín tốt';
                    statusClass = 'high';
                } else if (score >= 50) {
                    statusText = '⚡ Uy tín trung bình';
                    statusClass = 'medium';
                } else {
                    // Về lý thuyết không xảy ra vì score >= 50, nhưng giữ để an toàn
                    statusText = '⚠️ Cần cải thiện';
                    statusClass = 'low';
                }

                statusBadge.textContent = statusText;
                statusBadge.className = 'status ' + statusClass;
            }

            // Xử lý khi bấm nút
            function handleCheck() {
                const score = randomTrustScore();
                updateUI(score);
            }

            // Gắn sự kiện
            checkBtn.addEventListener('click', handleCheck);

            // (Tuỳ chọn) Tự động chạy lần đầu khi tải trang
            // handleCheck();
        })();
    </script>

</body>
</html>
